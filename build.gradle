name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 4.10.3
      - name: Build
        run: |
          set +e
          gradle build --no-daemon > log.txt 2>&1
          code=$?
          echo "=== HATALAR ==="
          grep -A3 "error:" log.txt | head -60
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: elementmod-jar
          path: build/libs/*.jar
